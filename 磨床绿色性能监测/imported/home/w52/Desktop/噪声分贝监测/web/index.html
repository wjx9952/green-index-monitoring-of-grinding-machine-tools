<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>噪声分贝监测</title><style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans SC",sans-serif;background:#07111f;color:#ecf7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#173f64,#07111f 55%);padding:28px}.wrap{max-width:1080px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.title{font-size:clamp(22px,4vw,34px);font-weight:750}.status{display:flex;align-items:center;gap:8px;color:#9db2c6}.dot{width:10px;height:10px;border-radius:50%;background:#ef5261;box-shadow:0 0 12px #ef5261}.online .dot{background:#37e69a;box-shadow:0 0 12px #37e69a}.grid{display:grid;grid-template-columns:1.2fr 2fr;gap:18px;margin-top:24px}.card{background:#0d1c2dd9;border:1px solid #27415b;border-radius:20px;padding:22px;box-shadow:0 15px 50px #0005}.reading{display:flex;align-items:baseline;justify-content:center;padding:30px 0}.value{font-size:clamp(76px,12vw,132px);font-weight:780;line-height:.85;letter-spacing:-7px}.unit{font-size:24px;color:#83a2ba;margin-left:12px}.level{text-align:center;font-size:19px;color:#58c7ff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}.stat{background:#12263a;border-radius:12px;padding:12px;text-align:center}.stat b{font-size:21px;display:block}.stat span,.meta{font-size:12px;color:#84a0b6}.chartHead{display:flex;justify-content:space-between;align-items:center}.chartHead select{background:#12263a;color:#dfefff;border:1px solid #36516c;border-radius:8px;padding:7px}canvas{width:100%;height:300px;margin-top:18px}.meta{margin-top:12px}.error{color:#ff8993;margin-top:8px;min-height:20px}@media(max-width:760px){body{padding:16px}.grid{grid-template-columns:1fr}.card{padding:17px}.value{letter-spacing:-4px}canvas{height:240px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="title">环境噪声监测</div><div class="meta">HH_07.06 · A 计权声压级</div></div><div id="status" class="status"><i class="dot"></i><span>离线</span></div></div>
<main class="grid"><section class="card"><div class="reading"><span id="value" class="value">--.-</span><span class="unit">dB(A)</span></div><div id="level" class="level">等待传感器数据</div><div class="stats"><div class="stat"><b id="min">--</b><span>最低 dB</span></div><div class="stat"><b id="avg">--</b><span>平均 dB</span></div><div class="stat"><b id="max">--</b><span>最高 dB</span></div></div><div id="meta" class="meta"></div><div id="error" class="error"></div></section>
<section class="card"><div class="chartHead"><b>声压级趋势</b><select id="range"><option value="60">近 1 分钟</option><option value="300" selected>近 5 分钟</option><option value="1800">近 30 分钟</option><option value="3600">近 1 小时</option></select></div><canvas id="chart"></canvas></section></main></div>
<script>
const $=id=>document.getElementById(id), canvas=$('chart'),ctx=canvas.getContext('2d');let data=[];
function level(v){if(v<50)return['安静','#47e6ad'];if(v<65)return['一般','#56c8ff'];if(v<80)return['较吵','#ffc857'];if(v<95)return['很吵','#ff8b5c'];return['危险','#ff5468']}
function draw(){const dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const pad={l:42,r:12,t:12,b:28},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,minY=30,maxY=130;ctx.font='12px system-ui';ctx.fillStyle='#7893a9';ctx.strokeStyle='#203b52';ctx.lineWidth=1;for(let y=30;y<=130;y+=20){let py=pad.t+ih*(maxY-y)/(maxY-minY);ctx.beginPath();ctx.moveTo(pad.l,py);ctx.lineTo(w-pad.r,py);ctx.stroke();ctx.fillText(y,5,py+4)}if(data.length<2)return;let t0=data[0].time,t1=data[data.length-1].time;if(t1===t0)t1++;let x=p=>pad.l+iw*(p.time-t0)/(t1-t0),y=p=>pad.t+ih*(maxY-Math.max(minY,Math.min(maxY,p.db)))/(maxY-minY);let g=ctx.createLinearGradient(0,pad.t,0,h-pad.b);g.addColorStop(0,'#ff596d');g.addColorStop(.5,'#53c8ff');g.addColorStop(1,'#37e69a');ctx.strokeStyle=g;ctx.lineWidth=2.5;ctx.beginPath();data.forEach((p,i)=>i?ctx.lineTo(x(p),y(p)):ctx.moveTo(x(p),y(p)));ctx.stroke();ctx.lineTo(x(data.at(-1)),h-pad.b);ctx.lineTo(x(data[0]),h-pad.b);ctx.closePath();ctx.globalAlpha=.12;ctx.fillStyle='#53c8ff';ctx.fill();ctx.globalAlpha=1}
async function refresh(){try{let r=await fetch('/api/data?seconds='+$('range').value),j=await r.json();data=j.points;$('status').className='status '+(j.online?'online':'');$('status').querySelector('span').textContent=j.online?'在线':'离线';let v=j.current?.db;if(v!=null){$('value').textContent=v.toFixed(1);let l=level(v);$('level').textContent=l[0];$('level').style.color=l[1];$('value').style.color=l[1]}for(let k of ['min','avg','max'])$(k).textContent=j[k]??'--';$('meta').textContent=`串口 ${j.device} · 协议 ${j.protocol}`;$('error').textContent=j.error?'错误：'+j.error:'';draw()}catch(e){$('error').textContent='无法连接监测服务'} }
$('range').onchange=refresh;window.onresize=draw;refresh();setInterval(refresh,1000);
</script></body></html>
